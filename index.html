<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <title>Speedometer Cluster</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>

<body>
  <div class="wrap" id="wrap" data-position="bottom">
    <svg class="cluster" id="cluster" viewBox="0 0 1024 262" preserveAspectRatio="xMidYMid meet" role="img"
      aria-label="Cluster speedometer">

      <defs>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2.2" result="b" />
          <feMerge>
            <feMergeNode in="b" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="glowW" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="1.4" result="b" />
          <feMerge>
            <feMergeNode in="b" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- tachometer: skala dibangun oleh app.js -->
      <g id="ticks"></g>
      <g id="mini" stroke="#fff" stroke-width="1.4" opacity=".85"></g>
      <line x1="767" y1="84" x2="758" y2="92" stroke="#ff2b1f" stroke-width="2.5" filter="url(#glow)" />

      <g id="numbers"></g>
      <text class="small" x="242" y="164">x1000r/min</text>

      <!-- kecepatan digital -->
      <g class="big" id="speed"></g>
      <text class="unit" id="unit-primary" x="608" y="158">mph</text>
      <text class="unit g" id="unit-secondary" x="608" y="180">km/h</text>

      <!-- health engine -->
      <g class="icon">
        <path d="M122 149 h6 v3 h-6 z" />
        <rect x="117" y="152" width="16" height="14" rx="1.5" />
        <path d="M113 156 v6 a2 2 0 0 0 4 0 v-6 a2 2 0 0 0 -4 0 z" />
        <path d="M133 157 h4 v5 h-4" />
      </g>
      <text class="lbl" x="88" y="188">E</text>
      <text class="lbl" x="268" y="188">F</text>
      <g id="temp"></g>
      <line x1="104" y1="202" x2="247" y2="202" stroke="#bbb" stroke-width="2" />

      <!-- bensin -->
      <g class="icon">
        <rect x="907" y="149" width="12" height="17" rx="1.5" />
        <path d="M910 153h6M919 153l5 4v8a2 2 0 0 0 4 0v-9l-3-3" />
      </g>
      <text class="lbl" x="780" y="188">E</text>
      <text class="lbl" x="958" y="188">F</text>
      <g id="fuel"></g>
      <line x1="800" y1="203" x2="940" y2="203" stroke="#bbb" stroke-width="2" />
      <line x1="870" y1="198" x2="870" y2="205" stroke="#fff" stroke-width="1.5" />

      <!-- sein, sabuk, lampu, gigi -->
      <g id="status" class="status" transform="translate(512 236) scale(1.25) translate(-512 -236)">
        <g id="turn-left" class="turn" transform="translate(424 236)">
          <path d="M0 -9 L-11 0 L0 9 Z" />
        </g>
        <g id="turn-right" class="turn" transform="translate(600 236)">
          <path d="M0 -9 L11 0 L0 9 Z" />
        </g>
        <g id="belt" class="status-icon belt off" transform="translate(474 236)">
          <path class="shape" d="M-7 -8 L7 8" />
          <rect class="shape" x="-3.4" y="-2.2" width="6.8" height="4.4" rx="1" />
        </g>
        <g id="headlight" class="status-icon head" transform="translate(506 236)">
          <path class="shape" d="M-7 -6 h5 a6 6 0 0 1 0 12 h-5 z" />
          <g class="rays">
            <path class="shape" d="M4 -6 l5 -3" />
            <path class="shape" d="M5 0 h6" />
            <path class="shape" d="M4 6 l5 3" />
          </g>
        </g>
        <text id="gear" class="gear" x="537" y="236">N</text>
        <text id="gear-arrow" class="gear-arrow" x="552" y="236"></text>
      </g>
    </svg>
  </div>
  <script src="app.js?v=8"></script>
</body>

</html>
